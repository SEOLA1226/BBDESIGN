<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BBDESIGN — 관리</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><script src="/config.js" defer></script><script src="/backend.js" defer></script><script src="/admin.js" defer></script></head><body><header class="header"><a class="brand" href="/">BBDESIGN<span class="brand-dot">®</span></a><a class="text-button" href="/" target="_blank" rel="noopener">사이트 보기 ↗</a></header><main class="admin-main"><section id="login" class="panel login-panel"><p class="eyebrow">FOR YOUR EYES ONLY</p><h2>관리자 로그인</h2><p class="subtext">나의 작업과 이야기를 관리하는 공간.</p><form id="login-form"><label id="admin-email" hidden>관리자 이메일<input name="email" type="email" autocomplete="username"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="login-error" class="login-error" role="alert"></p><button class="primary">로그인 →</button></form></section><section id="dashboard" hidden><div class="edit-heading"><div><p class="eyebrow">YOUR SPACE</p><h1>사이트 관리</h1><p class="subtext">내용을 수정한 뒤 저장하면 사이트에 바로 반영됩니다.</p></div><button id="logout" class="text-button">로그아웃 ↗</button></div><div class="admin-tabs" role="tablist" aria-label="관리 항목"><button role="tab" id="tab-sections" aria-controls="sections-panel" data-tab="sections" aria-selected="false">섹션 구성</button><button role="tab" id="tab-projects" aria-controls="projects-panel" data-tab="projects" aria-selected="true">포트폴리오</button><button role="tab" id="tab-info" aria-controls="info-panel" data-tab="info" aria-selected="false">공지 · 소개</button><button role="tab" id="tab-contact" aria-controls="contact-panel" data-tab="contact" aria-selected="false">연락처</button><button role="tab" id="tab-settings" aria-controls="settings-panel" data-tab="settings" aria-selected="false">비밀번호</button></div><section id="sections-panel" class="panel" role="tabpanel" aria-labelledby="tab-sections" hidden><h2>메인 폴더 구성</h2><p class="subtext">폴더 이름을 바꾸거나 순서를 이동하세요. 숨긴 섹션의 내용은 보관됩니다.</p><form id="site-form"><div id="section-list"></div><div class="form-row"><label>메인에 보여줄 작업 수<input name="previewCount" type="number" min="1" max="12" required></label><label class="check-label"><input name="showExamples" type="checkbox">작업이 없을 때 예시 디자인 표시</label></div><p class="helper">미리보기에는 최근 등록한 작업이 표시됩니다. 섹션은 최소 하나 이상 공개해야 합니다.</p><button class="primary" type="submit">섹션 설정 저장</button><span class="save-state" aria-live="polite"></span></form></section><section id="contact-panel" class="panel" role="tabpanel" aria-labelledby="tab-contact" hidden><h2>CONTACT 내용</h2><form id="contact-form"><label>연락처 페이지 제목<textarea name="contactHeading" maxlength="150" rows="2"></textarea></label><label>안내 문구<textarea name="contactBody" maxlength="2000" rows="4"></textarea></label><label>문의 이메일<input name="email" type="email" maxlength="150" placeholder="hello@example.com"></label><button class="primary" type="submit">연락처 저장</button><span class="save-state" aria-live="polite"></span></form></section><section id="projects-panel" role="tabpanel" aria-labelledby="tab-projects"><div class="panel"><div class="edit-heading"><h2>등록한 작업</h2><button id="new-project" class="primary">+ 작업 추가</button></div><div id="project-list"></div></div><div id="editor" class="panel" hidden><h2 id="editor-title">새 작업</h2><form id="project-form"><div class="form-row"><label>작업 제목<input name="title" maxlength="120" required placeholder="프로젝트 이름"></label><label>카테고리<input name="category" list="category-list" maxlength="60" required placeholder="예: Branding"><datalist id="category-list"></datalist></label></div><label>작업 설명<textarea name="description" maxlength="5000" rows="4" placeholder="작업의 배경과 이야기를 자유롭게 적어주세요."></textarea></label><label class="file-label">이미지 선택<input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><span class="helper">최대 10장 · 장당 8MB · 총 16MB<br>첫 번째 이미지가 대표 이미지로 표시됩니다.</span></label><div id="previews" class="previews"></div><div class="actions"><button class="primary" type="submit">저장하기</button><span class="save-state" aria-live="polite"></span><button class="secondary" id="cancel-edit" type="button">취소</button></div></form></div></section><section id="info-panel" class="panel" role="tabpanel" aria-labelledby="tab-info" hidden><h2>공지와 소개</h2><form id="info-form"><label>사이트 이름<input name="name" maxlength="60" required></label><label>한 줄 소개<textarea name="intro" maxlength="300" rows="2"></textarea></label><label>자세한 소개<textarea name="body" maxlength="3000" rows="5"></textarea></label><label>공지<textarea name="notice" maxlength="500" rows="3"></textarea></label><button class="primary" type="submit">변경사항 저장</button><span class="save-state" aria-live="polite"></span></form></section><section id="settings-panel" class="panel" role="tabpanel" aria-labelledby="tab-settings" hidden><h2>비밀번호 변경</h2><form id="password-form"><label>새 비밀번호<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>새 비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><p class="helper">12자 이상으로 입력해주세요. 변경 후 다시 로그인합니다.</p><button class="primary">비밀번호 변경</button></form></section></section></main><div id="status" role="status" aria-live="polite"></div></body></html>
