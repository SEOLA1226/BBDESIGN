# Node service with persistent storage. The starter plan and disk are paid.
services:
  - type: web
    name: bbdesign
    runtime: node
    plan: starter
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/content
    autoDeployTrigger: commit
    disk:
      name: bbdesign-content
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/bbdesign
      - key: COOKIE_SECURE
        value: 'true'
      - key: ADMIN_PASSWORD
        generateValue: true
